[project]
name = "dartmetrics-backend"
version = "0.1.0"
description = "DartMetrics backend: 501 scoring engine, API, and statistics"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
