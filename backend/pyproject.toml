[project]
name = "dartmetrics-backend"
version = "0.1.0"
description = "DartMetrics backend: 501, Cricket and Halve It scoring engines, API, and statistics"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.0",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2",
    "ruff>=0.14",
]

# Only app/ is the installable package; alembic/ is migration scripts.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
filterwarnings = [
    # Third-party deprecations we cannot act on (starlette's test client,
    # slowapi's asyncio.iscoroutinefunction); keep the test output clean.
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore::DeprecationWarning:slowapi.extension",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes/pycodestyle, import order, modern syntax, bugbear, simplify,
# ruff's own checks, comprehensions. Line length is not enforced: the
# code is not auto-formatted, and the few long lines are deliberate.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = [
    "E501",   # line length (see above)
    "B008",   # FastAPI's Depends() in defaults is the framework idiom
    "RUF012", # mutable class attributes: pydantic/SQLAlchemy declarations
]

[tool.ruff.lint.per-file-ignores]
# Alembic's generated revision files keep their template shape.
"alembic/versions/*" = ["I001", "UP"]
