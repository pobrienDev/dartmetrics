services:
  db:
    image: postgres:16
    container_name: dartmetrics-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dartmetrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dartmetrics_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dartmetrics}
    ports:
      - "5432:5432"
    volumes:
      - dartmetrics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dartmetrics}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dartmetrics_pgdata:
