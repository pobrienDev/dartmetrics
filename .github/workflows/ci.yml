name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartmetrics
          POSTGRES_PASSWORD: dartmetrics_ci
          POSTGRES_DB: dartmetrics
        ports:
          - 5432:5432
        # Wait until PostgreSQL actually accepts connections before tests run
        options: >-
          --health-cmd "pg_isready -U dartmetrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://dartmetrics:dartmetrics_ci@localhost:5432/dartmetrics
      SECRET_KEY: ci-only-test-signing-key-not-a-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type-check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartmetrics
          POSTGRES_PASSWORD: dartmetrics_ci
          POSTGRES_DB: dartmetrics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dartmetrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://dartmetrics:dartmetrics_ci@localhost:5432/dartmetrics
      SECRET_KEY: ci-only-test-signing-key-not-a-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Apply database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only (no push): proves the multi-stage image still builds,
      # including the frontend production bundle inside it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dartmetrics:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e RUN_MIGRATIONS=0 \
            -e DATABASE_URL=postgres://user:pass@localhost:5432/unused \
            -e SECRET_KEY=ci-only-test-signing-key-not-a-secret \
            dartmetrics:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/api/v1/health
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
          docker logs smoke
          docker rm -f smoke
