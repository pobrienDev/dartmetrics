name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dartmetrics
          POSTGRES_PASSWORD: dartmetrics_ci
          POSTGRES_DB: dartmetrics
        ports:
          - 5432:5432
        # Wait until PostgreSQL actually accepts connections before tests run
        options: >-
          --health-cmd "pg_isready -U dartmetrics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://dartmetrics:dartmetrics_ci@localhost:5432/dartmetrics
      SECRET_KEY: ci-only-test-signing-key-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
